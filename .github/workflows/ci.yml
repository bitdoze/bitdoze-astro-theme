name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    ci:
        name: Check, test, build (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24]
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check
              run: npm run check

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

            - name: Dependency review (prod, high+)
              run: npm audit --omit=dev --audit-level=high
